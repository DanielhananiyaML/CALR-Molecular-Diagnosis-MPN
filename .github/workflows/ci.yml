name: CALR CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q tests
      - name: Generate canonical variant table
        run: python scripts/calr_variant_annotation.py
      - name: Generate reference metadata
        run: python scripts/calr_sequence_analysis.py
